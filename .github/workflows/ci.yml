# 패키지 5종 각각 `flutter analyze` + `flutter test`.
# 디자인 시스템의 토큰 파리티 스위트는 형제 리포가 없는 이 환경에서
# test/fixtures/tokens.css 스냅샷과 대조한다 — skip 이 아니라 진짜 검사다.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - xerkonix-design-system
          - xerkonix-error-handler
          - xerkonix-http
          - xerkonix-logger
          - xerkonix-sizer
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      # 액션은 태그가 아니라 커밋 SHA 로 핀한다 (태그는 나중에 옮겨질 수 있다).
      - name: 체크아웃
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Flutter 도 버전을 핀한다 — 떠 있는 채널은 상류가 오르는 날 예고 없이 깨진다.
      # pubspec 의 하한(>=3.35.0)과 함께 올린다.
      - name: Flutter 3.44.6
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true

      - name: 의존성
        run: flutter pub get

      - name: 정적 분석
        run: flutter analyze

      - name: 테스트
        run: flutter test
