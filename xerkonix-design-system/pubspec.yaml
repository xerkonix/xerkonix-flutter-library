name: xerkonix_design_system
description: Flutter design system package for XERKONIX TACTILE tokens, themes, typography, and components.
version: 4.5.0
repository: https://github.com/xerkonix/xerkonix-flutter-library/tree/main/xerkonix-design-system
issue_tracker: https://github.com/xerkonix/xerkonix-flutter-library/issues

environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # Official stack fallback is Noto CJK KR VF via FontLoader
  # (tactile_fonts.dart). Not FontManifest — 10MB would block first
  # paint. Pretendard is not in tokens.css --font.
  assets:
    - lib/fonts/noto_sans_cjk_kr/NotoSansKR-VF.ttf
    - assets/brand/wordmark-ink.png
    - assets/brand/wordmark-paper.png
