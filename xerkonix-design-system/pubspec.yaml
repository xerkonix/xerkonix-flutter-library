name: xerkonix_design_system
description: Flutter design system package for XERKONIX TACTILE tokens, themes, typography, and components.
version: 4.7.0
repository: https://github.com/xerkonix/xerkonix-flutter-library/tree/main/xerkonix-design-system
issue_tracker: https://github.com/xerkonix/xerkonix-flutter-library/issues

environment:
  sdk: '>=3.9.0 <4.0.0'
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # Stack face is XK Sans KR (Pretendard Variable KS X 1001 subset, ~0.8MB)
  # via FontLoader (tactile_fonts.dart). Not FontManifest — first paint does
  # not wait for it. Generated: tools/build_pretendard_subset.py.
  assets:
    - lib/fonts/xk_sans_kr/XKSansKR-ksx1001-w400-600.ttf
    - assets/brand/wordmark-ink.png
    - assets/brand/wordmark-paper.png
